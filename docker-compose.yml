services:
  swift_pack_label:
    build: ./SwiftPackLabel
    container_name: swift_pack_label_container
    image: swift_pack_label_image
    restart: always
    volumes:
      - excel_data:/app/src/excel_data/data
      - archives_data:/app/src/archives/data
      - images_data:/app/src/images/uploads
    depends_on:
      - redis
    ports:
      - "8301:8001"
    networks:
      - vector_db_default
      - start_qr_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --databases 16
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vector_db_default

networks:
  vector_db_default:
    external: true

  start_qr_network:
    driver: bridge
    name: start_qr_network

volumes:
  excel_data:
  archives_data:
  images_data:
  redis_data:
